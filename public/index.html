<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#2f2e55;--ink:#1d1c33;--cream:#f3efe7;--paper:#fbfaf6}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:16px/1.3 system-ui,-apple-system,sans-serif;transition:background .4s}
body.dark{background:#33325c repeating-radial-gradient(circle at 85% 12%,transparent 0 70px,rgba(255,255,255,.06) 71px 72px) fixed;color:#fff}
#v{padding:18px 18px 110px;max-width:520px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.who{display:flex;align-items:center;gap:10px;font-size:15px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#d9c7b2;display:grid;place-items:center;font-weight:700}
.ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-weight:700}
.qn{font-size:14px;opacity:.6;margin-bottom:6px}
h2{font-size:25px;line-height:1.2;margin:0 0 22px;font-weight:800}
.op{display:block;width:100%;text-align:left;padding:17px 16px;margin-bottom:12px;border:2px solid transparent;border-radius:14px;background:var(--paper);color:var(--ink);font:600 16px system-ui;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:.2s}
.op:active{background:#dedad3}
.op.ok{background:#22a55a;color:#fff;border-color:#157a40}
.op.bad{background:#e5484d;color:#fff;border-color:#b32b30;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nx{width:100%;padding:17px;margin-top:10px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:700 16px system-ui}.nx:disabled{opacity:.3}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.res{text-align:center}.res h3{margin:0 0 4px;font-size:22px}.trophy{font-size:70px;margin:8px 0}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px 0}.pl small{opacity:.6}
.btns{display:flex;gap:10px;margin-top:6px}.btns button{flex:1;padding:15px;border-radius:12px;font:700 15px system-ui;border:2px solid var(--navy);background:#fff;color:var(--navy)}
.btns .p{background:var(--navy);color:#fff}
.sub{opacity:.65;font-size:14px}
.r{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(0,0,0,.08)}
.r:last-child{border:0}.r>span:first-child{width:28px;text-align:center}.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{color:#5b3fd6;font-weight:800}.tl{cursor:pointer}.rk{color:#c27b00;font-weight:700}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st .card{margin:0;text-align:center;padding:14px}.st b{display:block;font-size:24px;margin:4px 0}.st small{opacity:.6}
.pf{display:flex;align-items:center;gap:14px}.pf .av{width:64px;height:64px;font-size:26px}
.op.sel{border-color:var(--navy);transform:scale(.98)}
.ti{width:100%;padding:16px;border:2px solid transparent;border-radius:14px;font:600 17px system-ui;background:var(--paper);color:var(--ink);margin-bottom:10px;outline:0}
.ti:focus{border-color:var(--navy)}.ti.ok{background:#22a55a;color:#fff}.ti.bad{background:#e5484d;color:#fff;animation:sh .35s}
.fb{margin:0 2px 8px;font-weight:700}
.qi{display:block;width:100%;max-height:34vh;object-fit:contain;border-radius:14px;background:#fff;margin-bottom:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:9}.ov img{max-width:100%;max-height:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wd{font-size:11px;opacity:.55}
.cd{position:relative;aspect-ratio:1;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer}
.cd.has{background:#fff3d6;border:2px solid #f5b301}.cd em{position:absolute;top:2px;left:5px;font-size:10px;font-style:normal;opacity:.55}
.cd .av{width:28px;height:28px;font-size:12px;margin-top:8px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh button{width:40px;height:40px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:18px}
.st .w{grid-column:span 2}
nav button{font-size:12px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:492px;margin:auto;display:flex;padding:6px;border-radius:26px;background:var(--navy);box-shadow:0 6px 20px rgba(0,0,0,.25)}
nav button{flex:1;padding:11px 0;border:0;border-radius:20px;background:none;color:#fff;font:600 13px system-ui;opacity:.65}
nav button.on{opacity:1;background:var(--cream);color:var(--navy)}
</style></head><body>
<div id="v"></div>
<nav><button data-t="test">📝 Test</button><button data-t="me">👤 Profil</button><button data-t="cal">📅 Kalendar</button><button data-t="top">🏆 Reyting</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const U=tg.initDataUnsafe.user||{};
let curId=(tg.initDataUnsafe.start_param||'').replace(/^t_/,''),T,qi=0,sc=0,ans={},busy=false;
let cm=new Date(Date.now()+18e6),cy=cm.getUTCFullYear(),cmo=cm.getUTCMonth()+1;
const H={'x-init':tg.initData,'Content-Type':'application/json'};
const V=document.getElementById('v');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,b)=>{const r=await fetch(p,b?{method:'POST',headers:H,body:JSON.stringify(b)}:{headers:H});const d=await r.json();if(!r.ok)throw new Error(d.error||'Xato');return d};
const msg=t=>V.innerHTML='<div class="card">'+esc(t)+'</div>';
const avOf=(n,ph)=>ph?'<img class="av" src="'+esc(ph)+'">':'<div class="av">'+esc((n||'?')[0])+'</div>';
const av=()=>avOf(U.first_name,U.photo_url);
const $=id=>document.getElementById(id);
function tab(n){document.body.classList.remove('dark');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));({test:loadTest,me:loadMe,cal:loadCal,top:loadTop})[n]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function loadTest(){
  if(!curId)return msg('Kanaldagi postdan testni tanlang 📝');
  msg('Yuklanmoqda…');
  try{T=await api('/api/test?id='+encodeURIComponent(curId));
    if(T.done)return result(T);
    ans={};sc=0;(T.prog||[]).forEach(p=>{ans[p.qi]=1;if(p.ok)sc++});qi=0;while(ans[qi])qi++;quiz();
  }catch(e){msg(e.message)}
}
function quiz(){
  const q=T.qs[qi],n=T.qs.length,last=qi+1===n;
  V.innerHTML='<div class="top"><div class="who">'+av()+'<b>'+esc(U.first_name)+'</b></div><div class="ring" id="ring">'+sc+'</div></div>'+
    (T.img?'<img class="qi" id="qi" src="/api/img?id='+encodeURIComponent(curId)+'">':'')+
    '<div class="qn">Savol '+(qi+1)+' / '+n+'</div><h2>'+esc(q.q)+'</h2>'+
    (q.o?q.o.map((o,j)=>'<button class="op" data-j="'+j+'">'+esc(o)+'</button>').join(''):
      '<input class="ti" id="ti" autocomplete="off" placeholder="Javobni yozing"><div class="fb" id="fb"></div><button class="nx" id="ck" style="margin:0 0 6px">Tekshirish</button>')+
    '<button class="nx" id="nx" disabled>'+(last?'Natijani ko\'rish':'Keyingi')+'</button>';
  if($('qi'))$('qi').onclick=()=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<img src="'+$('qi').src+'">';o.onclick=()=>o.remove();document.body.appendChild(o)};
  if(q.o)V.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    if(busy)return;b.classList.add('sel');V.querySelectorAll('.op').forEach(o=>o.disabled=true); // bosilgan zahoti ko'rinadi
    send(+b.dataset.j)});
  else{const go=()=>{const v=$('ti').value.trim();if(!v||busy)return;$('ti').disabled=true;$('ck').disabled=true;send(v)};$('ck').onclick=go;$('ti').onkeydown=e=>{if(e.key==='Enter')go()}}
}
async function send(choice){
  busy=true;
  try{
    const d=await api('/api/answer',{id:curId,qi,choice});
    if(!('right' in d)){busy=false;return result(d.state)}
    if(T.qs[qi].o){const ops=V.querySelectorAll('.op');ops.forEach(o=>o.classList.remove('sel'));ops[d.right].classList.add('ok');if(!d.correct)ops[d.choice].classList.add('bad')}
    else{$('ti').classList.add(d.correct?'ok':'bad');$('fb').textContent=d.correct?'✅ To\'g\'ri!':'❌ To\'g\'ri javob: '+d.right}
    if(d.correct){sc++;$('ring').textContent=sc}
    try{tg.HapticFeedback.notificationOccurred(d.correct?'success':'error')}catch(e){}
    const nx=$('nx');nx.disabled=false;
    nx.onclick=()=>{if(d.finished&&d.state)result(d.state);else{qi++;quiz()}};
    busy=false;
  }catch(e){busy=false;alert(e.message);quiz()}
}
function board(a,t){return '<div class="card"><b>'+t+'</b>'+a.map((r,i)=>'<div class="r'+(r.me?' me':'')+'"><span>'+(['🥇','🥈','🥉'][i]||i+1)+'</span><span class="nm">'+esc(r.n)+'</span><b>'+r.s+'</b></div>').join('')+'</div>'}
function result(d){
  document.body.classList.add('dark');
  const m=d.done,p=Math.round(m.score/m.total*100);
  V.innerHTML='<div class="card res"><h3>Natijalar</h3><div class="sub">'+esc(d.title)+'</div><div class="trophy">'+(p>=80?'🏆':p>=50?'🥈':'💪')+'</div>'+
    '<h3>'+(p>=80?'Ajoyib natija!':p>=50?'Yaxshi!':'Harakat qiling!')+'</h3>'+
    '<div class="pl">'+av()+'<b>'+esc(U.first_name)+'</b><small>'+m.score+' / '+m.total+' ball · '+d.count+' kishi ichida '+m.rank+'-o\'rin</small></div>'+
    '<div class="btns"><button id="b1">Profil</button><button class="p" id="b2">Reyting</button></div></div>'+board(d.top,'Test reytingi');
  $('b1').onclick=()=>tab('me');$('b2').onclick=()=>tab('top');
}
async function loadMe(){
  msg('Yuklanmoqda…');
  try{
    const d=await api('/api/profile'),m=d.me;
    V.innerHTML='<div class="card pf">'+av()+'<div><b style="font-size:18px">'+esc(U.first_name)+'</b><div class="sub">'+(U.username?'@'+esc(U.username):'')+'</div></div></div>'+
    '<div class="st">'+[['📝',m.n,'Testlar',''],['⭐',m.pts,'Jami ball',''],['🎯',m.acc+'%','Aniqlik',''],['🏆',m.rank?m.rank+'-o\'rin':'—','Umumiy reyting',''],['👑',m.wins,'Kun g\'olibi bo\'lgan kunlar','w']].map(x=>'<div class="card '+x[3]+'"><div>'+x[0]+'</div><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div>'+
    '<div class="card"><b>Ishlangan testlar</b>'+(d.list.length?d.list.map(r=>'<div class="r tl" data-id="'+esc(r.id)+'"><span class="nm">'+esc(r.t)+'</span><span>'+r.s+'/'+r.n+'</span><span class="rk">#'+r.rank+'</span></div>').join(''):'<p class="sub">Hali test ishlamagansiz</p>')+'</div>';
    V.querySelectorAll('.tl').forEach(e=>e.onclick=()=>{curId=e.dataset.id;tab('test')});
  }catch(e){msg(e.message)}
}
async function loadTop(){
  msg('Yuklanmoqda…');
  try{const d=await api('/api/profile');V.innerHTML='<h2>🏆 Umumiy reyting</h2><div class="sub" style="margin:-14px 0 12px">Siz: '+(d.me.rank?d.me.rank+'-o\'rin':'—')+' · jami '+d.users+' kishi</div>'+(d.board.length?board(d.board,'Jami ball bo\'yicha (top 100)'):'<div class="card sub">Hali natijalar yo\'q</div>')}catch(e){msg(e.message)}
}
const MN=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
async function loadCal(){
  msg('Yuklanmoqda…');
  try{
    const mm=String(cmo).padStart(2,'0'),d=await api('/api/calendar?m='+cy+'-'+mm);
    const off=(new Date(Date.UTC(cy,cmo-1,1)).getUTCDay()+6)%7,nd=new Date(Date.UTC(cy,cmo,0)).getUTCDate();
    let c=['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>'<div class="wd">'+x+'</div>').join('');
    for(let i=0;i<off;i++)c+='<i></i>';
    for(let k=1;k<=nd;k++){const key=cy+'-'+mm+'-'+String(k).padStart(2,'0'),w=d.days[key];
      c+='<div class="cd'+(w?' has':'')+'" data-k="'+key+'">'+(w?avOf(w.win.n,w.win.photo):'')+'<em>'+k+'</em></div>'}
    V.innerHTML='<h2>📅 Kun g\'oliblari</h2><div class="mh"><button id="pm">‹</button><b>'+MN[cmo-1]+' '+cy+'</b><button id="nm">›</button></div><div class="cal">'+c+'</div><div id="dd" style="margin-top:14px"><p class="sub">Kunni bosing: o\'sha kuni birinchi o\'rin egasi ko\'rinadi.</p></div>';
    $('pm').onclick=()=>{cmo--;if(cmo<1){cmo=12;cy--}loadCal()};$('nm').onclick=()=>{cmo++;if(cmo>12){cmo=1;cy++}loadCal()};
    V.querySelectorAll('.cd.has').forEach(e=>e.onclick=()=>{const w=d.days[e.dataset.k];
      $('dd').innerHTML='<div class="card"><b>'+e.dataset.k+'</b>'+w.top.map((t,i)=>'<div class="r'+(i?'':' me')+'"><span>'+['🥇','🥈','🥉'][i]+'</span>'+avOf(t.n,t.photo).replace('class="av"','class="av" style="width:34px;height:34px;font-size:14px"')+'<span class="nm">'+esc(t.n)+'</span><b>'+t.pts+' ball</b></div>').join('')+'<p class="sub" style="margin:8px 0 0">Kun g\'olibi — o\'sha kuni jami ball eng ko\'p to\'plagan kishi.</p></div>'});
  }catch(e){msg(e.message)}
}
tab(curId?'test':'me');
</script></body></html>
