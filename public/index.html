<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#2f2e55;--ink:#1d1c33;--cream:#f3efe7;--paper:#fbfaf6}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:16px/1.3 system-ui,-apple-system,sans-serif;transition:background .4s}
body.dark{background:#33325c repeating-radial-gradient(circle at 85% 12%,transparent 0 70px,rgba(255,255,255,.06) 71px 72px) fixed;color:#fff}
#v{padding:18px 18px 110px;max-width:520px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.who{display:flex;align-items:center;gap:10px;font-size:15px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#d9c7b2;display:grid;place-items:center;font-weight:700}
.ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-weight:700}
.qn{font-size:14px;opacity:.6;margin-bottom:6px}
h2{font-size:25px;line-height:1.2;margin:0 0 22px;font-weight:800}
.op{display:block;width:100%;text-align:left;padding:17px 16px;margin-bottom:12px;border:2px solid transparent;border-radius:14px;background:var(--paper);color:var(--ink);font:600 16px system-ui;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:.2s}
.op:active{background:#dedad3}
.op.ok{background:#22a55a;color:#fff;border-color:#157a40}
.op.bad{background:#e5484d;color:#fff;border-color:#b32b30;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nx{width:100%;padding:17px;margin-top:10px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:700 16px system-ui}.nx:disabled{opacity:.3}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.res{text-align:center}.res h3{margin:0 0 4px;font-size:22px}.trophy{font-size:70px;margin:8px 0}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px 0}.pl small{opacity:.6}
.btns{display:flex;gap:10px;margin-top:6px}.btns button{flex:1;padding:15px;border-radius:12px;font:700 15px system-ui;border:2px solid var(--navy);background:#fff;color:var(--navy)}
.btns .p{background:var(--navy);color:#fff}
.sub{opacity:.65;font-size:14px}
.r{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(0,0,0,.08)}
.r:last-child{border:0}.r>span:first-child{width:28px;text-align:center}.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{color:#5b3fd6;font-weight:800}.tl{cursor:pointer}.rk{color:#c27b00;font-weight:700}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st .card{margin:0;text-align:center;padding:14px}.st b{display:block;font-size:24px;margin:4px 0}.st small{opacity:.6}
.pf{display:flex;align-items:center;gap:14px}.pf .av{width:64px;height:64px;font-size:26px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:492px;margin:auto;display:flex;padding:6px;border-radius:26px;background:var(--navy);box-shadow:0 6px 20px rgba(0,0,0,.25)}
nav button{flex:1;padding:11px 0;border:0;border-radius:20px;background:none;color:#fff;font:600 13px system-ui;opacity:.65}
nav button.on{opacity:1;background:var(--cream);color:var(--navy)}
</style></head><body>
<div id="v"></div>
<nav><button data-t="test">📝 Test</button><button data-t="me">👤 Profil</button><button data-t="top">🏆 Reyting</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const U=tg.initDataUnsafe.user||{};
let curId=(tg.initDataUnsafe.start_param||'').replace(/^t_/,''),T,qi=0,sc=0,ans={},busy=false;
const H={'x-init':tg.initData,'Content-Type':'application/json'};
const V=document.getElementById('v');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,b)=>{const r=await fetch(p,b?{method:'POST',headers:H,body:JSON.stringify(b)}:{headers:H});const d=await r.json();if(!r.ok)throw new Error(d.error||'Xato');return d};
const msg=t=>V.innerHTML='<div class="card">'+esc(t)+'</div>';
const av=()=>U.photo_url?'<img class="av" src="'+esc(U.photo_url)+'">':'<div class="av">'+esc((U.first_name||'?')[0])+'</div>';
function tab(n){document.body.classList.remove('dark');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));({test:loadTest,me:loadMe,top:loadTop})[n]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function loadTest(){
  if(!curId)return msg('Kanaldagi postdan testni tanlang 📝');
  msg('Yuklanmoqda…');
  try{T=await api('/api/test?id='+encodeURIComponent(curId));
    if(T.done)return result(T);
    ans={};sc=0;T.prog.forEach(p=>{ans[p.qi]=1;if(p.choice===p.right)sc++});qi=0;while(ans[qi])qi++;quiz();
  }catch(e){msg(e.message)}
}
function quiz(){
  const q=T.qs[qi],n=T.qs.length;
  V.innerHTML='<div class="top"><div class="who">'+av()+'<b>'+esc(U.first_name)+'</b></div><div class="ring" id="ring">'+sc+'</div></div>'+
    '<div class="qn">Savol '+(qi+1)+' / '+n+'</div><h2>'+esc(q.q)+'</h2>'+
    q.o.map((o,j)=>'<button class="op" data-j="'+j+'">'+esc(o)+'</button>').join('')+
    '<button class="nx" id="nx" disabled>'+(qi+1===n?'Natijani ko\'rish':'Keyingi')+'</button>';
  V.querySelectorAll('.op').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
}
async function pick(j){
  if(busy)return;busy=true;
  try{
    const d=await api('/api/answer',{id:curId,qi,choice:j});
    if(!('right' in d)){busy=false;return result(d.state)}
    const ops=V.querySelectorAll('.op');
    ops[d.right].classList.add('ok');if(!d.correct)ops[d.choice].classList.add('bad');
    ops.forEach(o=>o.disabled=true); // rang keyingi savolgacha saqlanadi
    if(d.correct){sc++;document.getElementById('ring').textContent=sc}
    try{tg.HapticFeedback.notificationOccurred(d.correct?'success':'error')}catch(e){}
    const nx=document.getElementById('nx');nx.disabled=false;
    nx.onclick=()=>{if(d.finished&&d.state)result(d.state);else{qi++;quiz()}};
    busy=false;
  }catch(e){busy=false;alert(e.message)}
}
function board(a,t){return '<div class="card"><b>'+t+'</b>'+a.map((r,i)=>'<div class="r'+(r.me?' me':'')+'"><span>'+(['🥇','🥈','🥉'][i]||i+1)+'</span><span class="nm">'+esc(r.n)+'</span><b>'+r.s+'</b></div>').join('')+'</div>'}
function result(d){
  document.body.classList.add('dark');
  const m=d.done,p=Math.round(m.score/m.total*100);
  V.innerHTML='<div class="card res"><h3>Natijalar</h3><div class="sub">'+esc(d.title)+'</div><div class="trophy">'+(p>=80?'🏆':p>=50?'🥈':'💪')+'</div>'+
    '<h3>'+(p>=80?'Ajoyib natija!':p>=50?'Yaxshi!':'Harakat qiling!')+'</h3>'+
    '<div class="pl">'+av()+'<b>'+esc(U.first_name)+'</b><small>'+m.score+' / '+m.total+' ball · '+d.count+' kishi ichida '+m.rank+'-o\'rin</small></div>'+
    '<div class="btns"><button id="b1">Profil</button><button class="p" id="b2">Reyting</button></div></div>'+board(d.top,'Test reytingi');
  document.getElementById('b1').onclick=()=>tab('me');document.getElementById('b2').onclick=()=>tab('top');
}
async function loadMe(){
  msg('Yuklanmoqda…');
  try{
    const d=await api('/api/profile'),m=d.me;
    V.innerHTML='<div class="card pf">'+av()+'<div><b style="font-size:18px">'+esc(U.first_name)+'</b><div class="sub">'+(U.username?'@'+esc(U.username):'')+'</div></div></div>'+
    '<div class="st">'+[['📝',m.n,'Testlar'],['⭐',m.pts,'Jami ball'],['🎯',m.acc+'%','Aniqlik'],['🏆',m.rank?m.rank+'-o\'rin':'—','Umumiy reyting']].map(x=>'<div class="card"><div>'+x[0]+'</div><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div>'+
    '<div class="card"><b>Ishlangan testlar</b>'+(d.list.length?d.list.map(r=>'<div class="r tl" data-id="'+esc(r.id)+'"><span class="nm">'+esc(r.t)+'</span><span>'+r.s+'/'+r.n+'</span><span class="rk">#'+r.rank+'</span></div>').join(''):'<p class="sub">Hali test ishlamagansiz</p>')+'</div>';
    V.querySelectorAll('.tl').forEach(e=>e.onclick=()=>{curId=e.dataset.id;tab('test')});
  }catch(e){msg(e.message)}
}
async function loadTop(){
  msg('Yuklanmoqda…');
  try{const d=await api('/api/profile');V.innerHTML='<h2>🏆 Umumiy reyting</h2>'+(d.board.length?board(d.board,'Jami ball bo\'yicha'):'<div class="card sub">Hali natijalar yo\'q</div>')}catch(e){msg(e.message)}
}
tab(curId?'test':'me');
</script></body></html>
