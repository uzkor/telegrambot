<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0b0b1a);--tx:var(--tg-theme-text-color,#fff);--card:rgba(127,127,160,.15);--ac:var(--tg-theme-button-color,#6c5ce7)}
body{margin:0;padding:16px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h2{margin:0 0 12px}.c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.o{display:block;width:100%;text-align:left;margin-top:8px;padding:11px;border-radius:10px;border:2px solid transparent;background:var(--card);color:var(--tx);font:inherit}
.o.s{border-color:var(--ac)}
.b{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:700 16px system-ui}.b:disabled{opacity:.4}
.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card)}.me{font-weight:700;color:var(--ac)}
.big{font-size:44px;font-weight:800;text-align:center}
</style></head><body><div id="app">Yuklanmoqda…</div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const id=(tg.initDataUnsafe.start_param||'').replace(/^t_/,'');
const H={'x-init':tg.initData,'Content-Type':'application/json'};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T,ans=[],t0=Date.now();
async function load(){
  if(!id)return $.textContent='Testga havola orqali kiring.';
  const r=await fetch('/api/test?id='+encodeURIComponent(id),{headers:H});
  const d=await r.json();
  if(!r.ok)return $.textContent=d.error;
  T=d;d.done?result(d):quiz();
}
function quiz(){
  $.innerHTML='<h2>'+esc(T.title)+'</h2>'+T.qs.map((q,i)=>
    '<div class="c"><b>'+(i+1)+'. '+esc(q.q)+'</b>'+q.o.map((o,j)=>
    '<button class="o" data-i="'+i+'" data-j="'+j+'">'+'ABCD'[j]+') '+esc(o)+'</button>').join('')+'</div>').join('')+
    '<button class="b" id="go" disabled>YUBORISH</button>';
  $.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;ans[i]=+b.dataset.j;
    $.querySelectorAll('.o[data-i="'+i+'"]').forEach(x=>x.classList.toggle('s',x===b));
    document.getElementById('go').disabled=T.qs.some((_,k)=>ans[k]===undefined);
  });
  document.getElementById('go').onclick=async()=>{
    document.getElementById('go').disabled=true;
    const r=await fetch('/api/submit',{method:'POST',headers:H,body:JSON.stringify({id,answers:ans,time:Math.round((Date.now()-t0)/1000)})});
    const d=await r.json();r.ok?result(d):alert(d.error);
  };
}
function result(d){
  const m=d.done;
  $.innerHTML='<h2>'+esc(d.title)+'</h2><div class="c"><div class="big">'+m.score+' / '+m.total+'</div>'+
  '<p style="text-align:center">Siz '+d.count+' kishi ichida <b>'+m.rank+'-o\'rinda</b></p></div>'+
  '<div class="c"><b>🏆 Reyting</b>'+d.top.map((r,i)=>'<div class="r'+(r.me?' me':'')+'"><span>'+(i+1)+'. '+esc(r.n)+'</span><span>'+r.s+'</span></div>').join('')+'</div>';
}
load().catch(()=>$.textContent='Xatolik, qayta urinib ko\'ring.');
</script></body></html>
